<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Workout</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav>
    <button data-view="day" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2" class="fill"/></svg>
      Dzień</button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="14" r="1" class="fill"/><circle cx="12" cy="14" r="1" class="fill"/><circle cx="16" cy="14" r="1" class="fill"/><circle cx="8" cy="18" r="1" class="fill"/><circle cx="12" cy="18" r="1" class="fill"/></svg>
      Kalendarz</button>
    <button data-view="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/><path d="M16 7h4v4"/></svg>
      Postęp</button>
    <button data-view="exercises">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      Ćwiczenia</button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2" class="knob"/><circle cx="15" cy="12" r="2.2" class="knob"/><circle cx="7" cy="18" r="2.2" class="knob"/></svg>
      Ustawienia</button>
  </nav>

  <div id="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="file-input" accept=".txt,text/plain" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
